server {
  listen 80;
  server_name _;
  client_max_body_size 11m;       # 单文件 10 MB，前端逐个上传

  location / {                    # Web 端
    root /usr/share/nginx/html/web;
    try_files $uri $uri/ /index.html;
  }
  location /m/ {                  # 移动 H5
    alias /usr/share/nginx/html/h5/;
    try_files $uri $uri/ /m/index.html;
  }
  location /api/notifications/stream {   # SSE 不缓冲
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # 只透传前置 TLS 代理给的协议与端口；直连时值为空，nginx 不发送该头，后端按 Host 判断同源
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/ {                # 原样转发，保留 /api 前缀
    proxy_pass http://backend:8080;
    # 带端口的原始 Host：后端据此判断请求是否同源，用 $host 会丢端口，非 80 端口时同源 POST 被当成跨域拒绝
    proxy_set_header Host $http_host;
    # 后端按它做 IP 限流与审计。前面还有可信反向代理时，设置 TRUSTED_PROXY_CIDR，
    # 启动脚本会生成 conf.d/00-real-ip.conf，把 $remote_addr 还原为 X-Forwarded-For 中的真实客户端 IP
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 只透传前置 TLS 代理给的协议与端口；直连时值为空，nginx 不发送该头，后端按 Host 判断同源
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
  }
}
