server:
  port: 8080
  forward-headers-strategy: native   # 信任内网代理（nginx）的 X-Forwarded-Proto，https 部署时同源判断才正确
  servlet:
    context-path: /api          # 接口统一前缀

spring:
  application:
    name: eas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eas}
    username: ${DB_USER:eas_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USER:eas_owner}
    password: ${FLYWAY_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB       # 单文件
      max-request-size: 11MB    # 单次请求，含 multipart 开销
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}                       # 真实 SMTP 通常为 true；Mailpit 演示场景保持 false
          starttls:
            enable: ${SMTP_STARTTLS:false}               # 587/25 用 STARTTLS；Mailpit 演示场景保持 false
          ssl:
            enable: ${SMTP_SSL:false}                    # 465 用隐式 SSL；Mailpit 演示场景保持 false
          connectiontimeout: 10000                       # TCP 建连超时（毫秒），避免 SMTP 故障时阻塞调度线程
          timeout: 10000                                 # 读写超时（毫秒）
          writetimeout: 10000
  jackson:
    time-zone: Asia/Shanghai
  web:
    locale: zh_CN
  mvc:
    format:                     # 查询参数中的日期统一按 ISO（YYYY-MM-DD）解析
      date: iso
      date-time: iso

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

eas:
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: 30          # 访问令牌有效期
    refresh-days: 7             # 刷新令牌有效期
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:eas-files}
  auth:
    cookie-secure: ${COOKIE_SECURE:true}   # 以 http 局域网地址演示时设为 false
    bootstrap-admin-password: ${EAS_ADMIN_PASSWORD:}   # 库中没有系统管理员时用它创建 admin（非 demo 部署）
  app:
    base-url: ${APP_BASE_URL:http://localhost}
    mail-from: ${MAIL_FROM:noreply@eas.local}

management:
  endpoints:
    web:
      exposure:
        include: health
