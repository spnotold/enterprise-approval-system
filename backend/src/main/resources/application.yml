server:
  port: 8080
  servlet:
    context-path: /api          # 接口统一前缀

spring:
  application:
    name: eas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eas}
    username: ${DB_USER:eas_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USER:eas_owner}
    password: ${FLYWAY_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB       # 单文件
      max-request-size: 11MB    # 单次请求，含 multipart 开销
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

eas:
  jwt:
    secret: ${JWT_SECRET:}
    expire-minutes: 120
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:eas-files}

management:
  endpoints:
    web:
      exposure:
        include: health
